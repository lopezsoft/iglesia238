name: CI/CD — Iglesia 238 (Dokploy)

on:
  push:
    branches:
      - main
      - feat/backend-frontend
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - feat/backend-frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-backend:
    name: Backend (Prisma · Typecheck · Tests · Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client & validate schema comments
        run: |
          npx prisma generate
          npm run db:comments:check

      - name: Typecheck & Build Backend
        run: |
          npm run typecheck
          npm run build

      - name: Run Backend Unit & Tenant Isolation Tests
        run: npm run test

  ci-frontend:
    name: Frontend (Tooltips Check · Build · Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify no native HTML title attributes
        run: node scripts/check-native-title.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build Angular Production Bundle
        working-directory: frontend
        run: npm run build -- --configuration=production

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npx ng test --watch=false

  deploy-dokploy:
    name: CD — Trigger Dokploy Deployment (matiasimpulso.com)
    needs: [ci-backend, ci-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/backend-frontend' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Webhook (if DOKPLOY_WEBHOOK_URL secret is configured)
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL no está configurado aún en GitHub Secrets; omitiendo disparo por webhook (o Dokploy despliega por integración Git)."
            exit 0
          fi
          echo "Disparando despliegue en Dokploy para matiasimpulso.com..."
          curl --fail --silent --show-error -X POST "$DOKPLOY_WEBHOOK_URL"
