# Producción: todos los servicios en contenedores.
# docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# El contenedor frontend sirve la SPA en Nginx y hace proxy de /api/ hacia backend:3000.
# El puerto del backend se publica solo en 127.0.0.1 del servidor para diagnóstico local.
name: church-prod

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE}
      # Dueño del esquema: solo lo usa el migrador.
      MARIADB_USER: ${MYSQL_USER:?Define MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD}
      # Usuario de la API, solo con permisos de datos (docker/mariadb/init-prod).
      APP_DB_USER: ${APP_DB_USER:?Define APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/init-prod:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplica migraciones y catálogos una sola vez, antes de arrancar el backend.
  migrator:
    build:
      context: ./backend
      target: migrator
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:?Define CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-1048576}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      REFRESH_TTL: ${REFRESH_TTL:-7d}
      REFRESH_MAX_LIFETIME: ${REFRESH_MAX_LIFETIME:-30d}
      APP_BASE_URL: ${APP_BASE_URL:?Define APP_BASE_URL}
      DEFAULT_COUNTRY_ISO: ${DEFAULT_COUNTRY_ISO:-CO}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - edge
      - data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge

volumes:
  db_data:
  redis_data:

networks:
  edge:
  # Sin salida a internet: solo el backend y el migrador llegan a los datos.
  data:
    internal: true
