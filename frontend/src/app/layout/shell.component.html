<!-- <base href="/"> would turn a bare fragment into a reload of '/': focus <main> by script. -->
<a class="skip-link" href="#main-content" (click)="skipToContent($event)">Saltar al contenido</a>
<div class="shell" [class.shell--menu-open]="menuOpen()">
  <nav #sidebar class="rail" aria-label="Navegación principal" id="main-navigation">
    <a class="rail__brand" routerLink="/dashboard" title="Iglesia 238">
      <span class="rail__logo"><app-icon name="church" [size]="24" /></span>
      <span class="rail__brand-text">
        <span class="rail__product">Iglesia 238</span>
        <span class="rail__scope">{{ activeScope()?.label }}</span>
      </span>
    </a>

    <div class="rail__scroll">
      @for (group of navGroups(); track group.label) {
        <div class="rail__group" role="group" [attr.aria-label]="group.label">
          <p class="rail__heading">{{ group.label }}</p>
          <ul>
            @for (item of group.items; track item.path) {
              <li>
                <a
                  #link="routerLinkActive"
                  class="rail__link"
                  [routerLink]="item.path"
                  routerLinkActive="is-active"
                  ariaCurrentWhenActive="page"
                  [attr.title]="item.label"
                >
                  <span class="rail__icon">
                    <app-icon [name]="item.icon" [size]="22" [variant]="link.isActive ? 'duotone' : 'line'" />
                  </span>
                  <span class="rail__label" aria-hidden="true">{{ item.shortLabel }}</span>
                  <span class="rail__label-full">{{ item.label }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </nav>

  @if (menuOpen()) {
    <!-- Mobile only: pointer users close the menu here; keyboard users press Escape. -->
    <div class="shell__backdrop" aria-hidden="true" (click)="closeMenu()"></div>
  }

  <div class="workspace">
    <header class="topbar">
      <button
        #menuToggle
        type="button"
        class="btn btn--ghost btn--icon topbar__menu"
        aria-controls="main-navigation"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Menú"
        (click)="toggleMenu()"
      >
        <app-icon name="menu" />
      </button>

      <app-quick-create-menu />
      <app-scope-switcher />
      <app-status-cluster />

      <div class="topbar__end">
        <app-user-menu />
      </div>
    </header>

    <main #mainContent id="main-content" class="content" tabindex="-1">
      <router-outlet />
    </main>

    <app-footer />
  </div>
</div>
