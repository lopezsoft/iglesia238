# ==========================================
# Nginx Configuration - Angular SPA
# Optimizado para Single Page Application
# ==========================================

server {
    listen 80;
    listen [::]:80;
    
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Seguridad: Ocultar versión de Nginx
    server_tokens off;

    # Compresión gzip para mejorar rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/x-javascript
        image/svg+xml;

    # Cache para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Ruta principal - SPA Routing
    # CRÍTICO: try_files asegura que Angular maneje todas las rutas
    # Soluciona el problema de 404 al recargar páginas en rutas del cliente
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy reverso para API del backend (opcional, si se usa Nginx como gateway)
    # Descomenta si necesitas que Nginx haga proxy al backend
    # location /api {
    #     proxy_pass http://backend:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # Manejo de errores
    error_page 404 /index.html;
    
    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
