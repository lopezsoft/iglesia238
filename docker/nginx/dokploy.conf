# Nginx Multi-Host para el contenedor unificado en Dokploy:
# 1. iglesia238.com / www.iglesia238.com -> Sitio principal (Landing en /usr/share/nginx/landing)
# 2. app.iglesia238.com (default_server)  -> Aplicación Angular (/usr/share/nginx/html) + proxy /api/ -> 127.0.0.1:3000
# 3. api.iglesia238.com                   -> API NestJS/Fastify directo -> 127.0.0.1:3000

# =====================================================================
# 1. Sitio principal: iglesia238.com y www.iglesia238.com
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name www.iglesia238.com;

    # Host canónico único para SEO: www -> apex (evita contenido duplicado).
    return 301 https://iglesia238.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name iglesia238.com;
    root /usr/share/nginx/landing;
    index index.html;

    server_tokens off;

    # Redirects relativos (p. ej. /solutions -> /solutions/): detrás de Traefik el
    # esquema interno es http y generaría un salto extra http -> https.
    absolute_redirect off;

    # La landing es estática (Astro): las rutas inexistentes deben responder 404 real.
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Assets de Astro con hash en el nombre: inmutables, caché de 1 año.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
        try_files $uri =404;
    }

    # URLs antiguas en español -> slugs en inglés (301 para conservar el posicionamiento).
    location ~ ^/soluciones/?$ { return 301 /solutions/; }
    location ~ ^/como-funciona/?$ { return 301 /how-it-works/; }
    location ~ ^/seguridad/?$ { return 301 /security/; }
    location ~ ^/docs/manual-roles/?$ { return 301 /docs/roles-manual/; }
    location ~ ^/docs/auto-alojamiento/?$ { return 301 /docs/self-hosting/; }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}

# =====================================================================
# 2. Subdominio de API directa: api.iglesia238.com
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.iglesia238.com;

    server_tokens off;
    client_max_body_size 2m;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = /api/health/ready {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
}

# =====================================================================
# 3. Aplicación Web Angular: app.iglesia238.com (y default_server)
# =====================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name app.iglesia238.com _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    # Restaura la IP real del visitante cuando Nginx está detrás de Traefik (Dokploy) en redes privadas de Docker.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.iglesia238.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Estado del servidor web.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # El readiness expone el estado de MariaDB y Redis: oculto al exterior.
    location = /api/health/ready {
        return 404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Manifiesto de versión de la SPA: nunca se almacena en caché para permitir auto-actualización inmediata.
    location = /version.json {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Archivos con hash del build de Angular: caché larga.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Rutas del cliente (SPA): siempre index.html, sin caché en navegador ni proxies.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.iglesia238.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
